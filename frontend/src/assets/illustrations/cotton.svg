<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="54" fill="#F0FDF4" />

  <!-- Shadow -->
  <ellipse cx="60" cy="100" rx="32" ry="6" fill="#E2E8F0" />

  <!-- Cotton Stem / Branch -->
  <path d="M 60 96 Q 58 75, 60 62" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
  
  <!-- Calyx / Sepals (Green/Brown leaves supporting cotton boll) -->
  <path d="M 60 76 C 45 84, 30 72, 34 56 C 42 62, 54 68, 60 76 Z" fill="#92400E" stroke="#522204" stroke-width="1.5" />
  <path d="M 60 76 C 75 84, 90 72, 86 56 C 78 62, 66 68, 60 76 Z" fill="#92400E" stroke="#522204" stroke-width="1.5" />
  <path d="M 60 80 C 60 92, 52 90, 48 94" stroke="#15803D" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Fluffy White Cotton Puffs (3 lobes) -->
  <!-- Left puff -->
  <circle cx="42" cy="52" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
  <!-- Right puff -->
  <circle cx="78" cy="52" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
  <!-- Top puff -->
  <circle cx="60" cy="36" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
  <!-- Center overlap -->
  <circle cx="60" cy="52" r="20" fill="#FFFFFF" />

  <!-- Shading Highlights -->
  <ellipse cx="38" cy="46" rx="6" ry="10" fill="#F8FAFC" />
  <ellipse cx="82" cy="46" rx="6" ry="10" fill="#F8FAFC" />
  <ellipse cx="60" cy="30" rx="10" ry="6" fill="#F8FAFC" />

  <!-- Cute Face -->
  <circle cx="52" cy="52" r="3.2" fill="#1E293B" />
  <circle cx="68" cy="52" r="3.2" fill="#1E293B" />
  <circle cx="51" cy="51" r="1.2" fill="#FFFFFF" />
  <circle cx="67" cy="51" r="1.2" fill="#FFFFFF" />
  <!-- Rosy cheeks -->
  <ellipse cx="46" cy="56" rx="3.5" ry="2" fill="#F43F5E" opacity="0.45" />
  <ellipse cx="74" cy="56" rx="3.5" ry="2" fill="#F43F5E" opacity="0.45" />
  <!-- Happy Smile -->
  <path d="M 57 55 Q 60 60, 63 55" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
</svg>
